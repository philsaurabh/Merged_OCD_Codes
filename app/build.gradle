plugins {
    id 'com.android.application'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.iitp.obsencemediadetector"
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        mlModelBinding true
        viewBinding true
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    implementation 'org.tensorflow:tensorflow-lite-support:0.1.0'
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.1.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Tensorflow dependencies
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite-task-text:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite-task-audio:0.3.0'

    // TensorFlow Lite Android Support Library
    implementation 'org.tensorflow:tensorflow-lite-support:0.3.0'

    // Picasso
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Gson
    implementation 'com.squareup.retrofit2:converter-gson:2.8.1'

    // Xml to Pdf
    implementation 'com.github.Gkemon:XML-to-PDF-generator:2.5'

    // ExoPlayer to play Video
    implementation "com.google.android.exoplayer:exoplayer:2.16.1"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // SugarRecord
    api 'com.github.satyan:sugar:1.3.1'

    // Media Meta Data
//    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-core:1.0.19'
//    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-native:1.0.19'

    // Memory leak check
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'
}